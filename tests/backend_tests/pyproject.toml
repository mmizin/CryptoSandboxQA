[project]
name = "crypto-sandbox-qa-backend-tests"
version = "0.0.0"
requires-python = ">=3.10"
description = "Python API tests for CryptoSandboxQA (scaffolding)."
dependencies = [
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
