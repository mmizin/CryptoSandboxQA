# Pytest configuration for backend API / integration tests.
# Marker names and @… vocabulary: .cursor/rules/pytest-backend-api-tests.mdc

[pytest]
pythonpath = src
testpaths = tests
addopts = --alluredir=allure-results

markers =
    e2e: @e2e — multi-step HTTP API journeys (typical: tests/integration/).
    smoke: @smoke — small, fast checks for frequent runs.
    merge_gate: @merge-gate — expected in pre-merge CI subsets.
    client_validation: @client-validation — request/body validation and negative matrices.
